apiVersion: fluidos.eu/v1
kind: FLUIDOSDeployment
metadata:
  name: temp-sensor
  namespace: sensors
  annotations:
    fluidos-intent-sensor: "humidity"
    fluidos-intent-latency: "100"
spec:
  apiVersion: v1
  kind: Pod
  metadata:
    namespace: sensors
    name: temp-sensor
    labels:
      app: temp-sensor
  spec:
    containers:
      - name: sensor
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh","-c"]
        args:
          - |
            pip install --quiet flask && \
            python - <<'PY'
            from flask import Flask, jsonify
            import random, time
            app = Flask(__name__)
            @app.route('/sensor')
            def sensor():
                data = {
                    'timestamp': int(time.time()),
                    'temperature': round(20 + 10*random.random(), 2),
                    'humidity':    round(30 + 20*random.random(), 2)
                }
                return jsonify(data)
            app.run(host='0.0.0.0', port=8080)
            PY
        ports:
          - containerPort: 8080
        resources:               # REQUIRED by the model
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"




